<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src data:; connect-src 'none';">

<button type="button" data-pug-action="paw" aria-label="握手 / Shake"><svg aria-hidden="true" focusable="false" viewBox="0 0 32 32" class="pug-glyph" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M7.8 20c2-1.1 3.3-5.7 6.4-6.8 2.7-1 4.5.6 5.7 2.5 1.5 2.2 3.9 3.2 4.5 5.5.8 3.6-1.8 5.1-4.7 4.5-2.3-.5-4.1-1.1-6.3-.3-2.9 1.1-6.3 1.1-6.9-1.8-.3-1.4.2-2.6 1.3-3.6Z"/><g class="pug-accent"><ellipse cx="6.4" cy="13" rx="2.1" ry="3" transform="rotate(-28 6.4 13)"/><ellipse cx="12" cy="7.8" rx="2.1" ry="3.1" transform="rotate(-10 12 7.8)"/><ellipse cx="19.2" cy="7.8" rx="2.1" ry="3.1" transform="rotate(15 19.2 7.8)"/><ellipse cx="25.4" cy="12.8" rx="2" ry="2.9" transform="rotate(27 25.4 12.8)"/></g></svg><span>握手</span></button>
<button type="button" data-pug-action="bone" aria-label="吃骨头 / Bone"><svg aria-hidden="true" focusable="false" viewBox="0 0 32 32" class="pug-glyph" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 6.1a3 3 0 0 1 5.9.8 3.2 3.2 0 1 1 .7 6.2 4 4 0 0 1-2.6-.9L12.3 23.5a3.4 3.4 0 1 1-6.4 1.6A3.4 3.4 0 1 1 8 18.7l11.3-11.3Z"/><path d="m13.1 16.8 4.5-4.5" class="pug-accent"/><circle cx="19.4" cy="10.3" r="1.2" class="pug-emitter"/></svg><span>吃骨头</span></button>
<button type="button" data-pug-action="food" aria-label="吃狗粮 / Kibble"><svg aria-hidden="true" focusable="false" viewBox="0 0 32 32" class="pug-glyph" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 16.4h17l3.1 8a1.8 1.8 0 0 1-1.7 2.3H6a1.8 1.8 0 0 1-1.7-2.3l3.2-8Z"/><path d="M9 15.8a3 3 0 0 1 4.9-3.6 3.4 3.4 0 0 1 6.4-.8 2.7 2.7 0 0 1 3.1 4.2M9.6 22.2h3.9m2.4 0h.4" class="pug-accent"/><circle cx="10.8" cy="7" r="1" class="pug-emitter"/><circle cx="17.1" cy="5.1" r="1.2" class="pug-emitter"/></svg><span>吃狗粮</span></button>
<button type="button" data-pug-action="jump" aria-label="跳一跳 / Jump"><svg aria-hidden="true" focusable="false" viewBox="0 0 32 32" class="pug-glyph" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M4 23.8c1.9-7.4 7.1-15.1 15-16.6 2.8-.5 5.5-.5 7.7-.1m-4.1-4.2 4.9 4-4.9 4.3"/><path d="m8.6 22.5 2.4-4.1m1.5-2 1.7-1.8M3.7 27h6.1" class="pug-accent"/><circle cx="15.9" cy="12.8" r="1.2" class="pug-emitter"/></svg><span>跳一跳</span></button>
<button type="button" data-pug-action="bark" aria-label="叫一叫 / Bark"><svg aria-hidden="true" focusable="false" viewBox="0 0 32 32" class="pug-glyph" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"><path d="M4.8 13h4.4l5.8-5.1v16.2l-5.8-4.9H4.8Z"/><path d="M19 11a7 7 0 0 1 0 10m3.9-13.6a12 12 0 0 1 0 17.2" class="pug-accent"/><circle cx="26.5" cy="5.6" r="1.2" class="pug-emitter"/><circle cx="26.5" cy="26.3" r="1.2" class="pug-emitter"/></svg><span>叫一叫</span></button>
<button type="button" class="pug-dismiss" aria-label="关闭互动菜单 / Close menu"><svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m5 5 6 6m0-6-6 6"/></svg></button>
</div>
<audio id="pug-bark" preload="auto" aria-hidden="true" hidden></audio>
<span id="pug-status" role="status" class="pug-sr-only"></span>
<script id="daba-frames" type="application/json">@@PET_ATLAS@@</script>
<script src="pet.js"></script>
<script src="desktop.js"></script>
</body>
</html>
